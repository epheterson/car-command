# The house style here is dense: one statement, one line, up to about 200 columns,
# because the queries and the table rows read better whole than wrapped. This file
# exists so `black` agrees with that instead of exploding every call onto six lines.
[tool.black]
line-length = 200
skip-string-normalization = true

[tool.ruff]
line-length = 200

[tool.ruff.lint]
# F catches a name used but never imported: a call like that raises on every tick of a
# job that runs only inside a recorder hook, where nothing surfaces it.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["stack/web"]
