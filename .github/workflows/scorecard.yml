# OpenSSF Scorecard: how the repository is kept (pinned dependencies, token permissions, branch
# protection, signed releases and the rest), scored and published to scorecard.dev for the
# README's badge, with the details under Security › Code scanning.
# It reads branch protection through the default token, which sees most of it; a fine-grained
# token as SCORECARD_TOKEN would see all of it, and nothing here needs one.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 2" # Tuesdays, 05:41 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to scorecard.dev, which the badge reads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing works only from the default branch of a public repository.
          publish_results: ${{ github.ref_name == github.event.repository.default_branch && !github.event.repository.private }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
