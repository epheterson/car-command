# The one-container image, for amd64 and arm64, published to GitHub's registry as
#   ghcr.io/<owner>/<repo>:<version>
# release.yml calls this once it has tagged a new version. Only the version's own tag is pushed
# here; publish.yml points :<major>.<minor> and :latest at it when the release is published, so
# nobody pulls a version before its notes are out. Run it by hand to rebuild a tag that exists.
#
# The only credentials are the workflow's own GITHUB_TOKEN, allowed to write packages and
# attestations for this run, and its OIDC token, which Sigstore and GitHub exchange for a
# short-lived signing certificate. No secret is set. Every action is pinned to a commit, with
# its version in the comment beside it.
#
# What a published image carries, and how to check it:
#   an SBOM and build provenance inside the image index (buildx)
#   a GitHub build-provenance attestation:  gh attestation verify oci://ghcr.io/epheterson/car-command:TAG --repo epheterson/car-command
#   a keyless cosign signature:             cosign verify ghcr.io/epheterson/car-command:TAG \
#     --certificate-identity-regexp '^https://github.com/epheterson/car-command/.github/workflows/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release image

on:
  workflow_call:
    inputs:
      version:
        description: the version to build, without the v (0.2.0)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: the version to build, without the v (0.2.0); its tag must exist
        type: string
        required: true

permissions: {}

jobs:
  image:
    name: build and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image
      id-token: write # OIDC: the keyless signature and the attestation
      attestations: write # store the provenance attestation
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lower case; the action lowers them, and the labels link the
      # package to this repository and its license.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=Car Command
            org.opencontainers.image.description=Drive and charge history for electric cars, on your own server: Postgres, the site and the connector in one container.
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.version=${{ inputs.version }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: stack
          file: stack/aio/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # The registry path in lower case, as the image was pushed under.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
