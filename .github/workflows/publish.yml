# When a maintainer publishes a drafted release (release.yml), point the image's moving tags
# at the version's image: :<major>.<minor> and :latest. A pre-release moves neither.
# The image is the one release.yml already built, signed and attested; only tags change.
name: publish

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote:
    name: point latest at the release
    if: ${{ !github.event.release.prerelease && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG#v}
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)
          [ -n "$digest" ] && [ "$digest" != null ] || { echo "::error::no image $image:$version; run release-image.yml for $version"; exit 1; }
          docker buildx imagetools create -t "$image:${version%.*}" -t "$image:latest" "$image@$digest"
          echo "$image:${version%.*} and :latest now point at $version ($digest)" >> "$GITHUB_STEP_SUMMARY"
